name: Bench

# Runs `rusty-chess bench` in release mode, with and without the `stats`
# feature, on every PR and on every push to main. Uploads bench.jsonl and
# stats.jsonl as artifacts. Gates only on the node signature: NPS on shared
# runners is noisy, so it is reported but never compared.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: bench-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Setting RUSTFLAGS also replaces the `target-cpu=native` from
  # .cargo/config.toml, which is what we want on shared runners.
  RUSTFLAGS: -D warnings

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the baseline artifact from the latest run on the base branch
      pull-requests: write # post and refresh the bench comment
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries, with and without stats
        run: |
          cargo build --release --locked
          cargo build --release --locked --features stats --target-dir target/stats
      - name: Bench
        id: bench
        run: |
          target/release/rusty-chess bench --out bench.jsonl | tee bench.log
          target/stats/release/rusty-chess bench --out stats.jsonl > stats.log
          nodes=$(sed -n 's/^Nodes searched  : //p' bench.log)
          nps=$(sed -n 's/^Nodes\/second    : //p' bench.log)
          stats_nodes=$(sed -n 's/^Nodes searched  : //p' stats.log)
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"
          {
            echo "## Bench"
            echo
            echo "- Bench: \`$nodes\`"
            echo "- NPS: \`$nps\` (shared runner; not comparable between runs)"
            echo "- Bench with stats: \`$stats_nodes\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$nodes" != "$stats_nodes" ]; then
            echo "::error::the stats build searched $stats_nodes nodes but the release build searched $nodes; counters must not change search behaviour"
            exit 1
          fi
      - name: Check the Bench line in the PR description
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          NODES: ${{ steps.bench.outputs.nodes }}
        run: |
          # `Bench: 12345` or `Bench: `12345``; the template placeholder `Bench: <nodes>` is not a claim.
          claimed=$(printf '%s\n' "$BODY" | grep -oE 'Bench: *`?[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)
          if [ -z "$claimed" ]; then
            echo "No Bench line in the PR description; nothing to check (CI measured $NODES)."
          elif [ "$claimed" = "$NODES" ]; then
            echo "PR description claims Bench: $claimed and CI measured $NODES."
          else
            echo "::error::PR description claims Bench: $claimed but CI measured $NODES"
            exit 1
          fi
      - name: Fetch the base branch's targets for the ratchet check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          # No file on the base branch (the PR that introduces it) means no ratchet check.
          git show "${{ github.event.pull_request.base.sha }}:perf-targets.toml" > base-perf-targets.toml 2>/dev/null || rm -f base-perf-targets.toml
      - name: Performance gate
        # Speed bars are noisy on shared runners: reported on every PR, enforced
        # on release PRs and on main. Efficiency bars are always enforced, and
        # a PR may never lower a bar. The verdict is recorded and the job fails
        # only after the comment below has been posted.
        id: gate
        env:
          ENFORCE: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'release-please--')) && '--enforce-noisy' || '' }}
        run: |
          args="--targets perf-targets.toml --env ci $ENFORCE"
          if [ -f base-perf-targets.toml ]; then args="$args --ratchet-from base-perf-targets.toml"; fi
          if cargo run --release --locked -p rusty-chess-tools --bin perf-gate -- $args bench.jsonl stats.jsonl perft.jsonl > gate.md; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "enforced=${ENFORCE:+true}" >> "$GITHUB_OUTPUT"
          cat gate.md
          { echo "## Performance gate"; echo; cat gate.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the baseline from the latest Bench run on the base branch
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Bench --branch "$BASE_REF" --event push --status success --limit 1 --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$run" ]; then echo "No successful Bench run on $BASE_REF yet; no baseline."; exit 0; fi
          id=$(jq -r .databaseId <<<"$run"); sha=$(jq -r .headSha <<<"$run")
          if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name bench --dir base; then
            echo "label=${BASE_REF}@${sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "The baseline artifact from run $id is gone (expired?); no baseline."
          fi
      - name: Build the bench comment
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_LABEL: ${{ steps.baseline.outputs.label }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          NOISY: ${{ steps.gate.outputs.enforced == 'true' && '--noisy-enforced' || '' }}
        run: |
          mkdir -p head && cp bench.jsonl stats.jsonl head/ && { cp perft.jsonl head/ 2>/dev/null || true; }
          args=(--targets perf-targets.toml --head head --head-label "${HEAD_SHA:0:7}" --gate gate.md --gate-passed "$GATE_PASSED" $NOISY)
          if [ -n "$BASE_LABEL" ]; then args+=(--base base --base-label "$BASE_LABEL"); fi
          cargo run --release --locked -p rusty-chess-tools --bin bench-report -- "${args[@]}" > comment.md
          cat comment.md
      - name: Post the bench comment (refreshed on every push)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bench
          path: comment.md
      - name: Fail if the performance gate failed
        if: steps.gate.outputs.passed != 'true'
        run: |
          echo "::error::the performance gate failed; see gate.md in the artifact or the bench comment"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            bench.jsonl
            stats.jsonl
            bench.log
            stats.log
            gate.md
            comment.md
          if-no-files-found: error
