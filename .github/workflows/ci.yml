name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # CI builds for a portable baseline rather than the host CPU in .cargo/config.toml.
  RUSTFLAGS: -D warnings

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Dependabot's commit messages carry a capitalised subject and a release
    # notes body, which this repo's one-line rule rejects. Its PRs are squash
    # merged under a lowercase Conventional Commit title instead, so the
    # commit that lands on main still conforms. A skipped job satisfies the
    # required status check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit in the PR range is checked, so rebase merges land
          # only one-line Conventional Commits on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in base..head
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      - name: Unit test the only-coauthor-trailers rule
        run: npm test

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, so it must be a
      # valid Conventional Commit too.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            ci
            build
            perf
            style
            test
            revert
          requireScope: false
          # Dependabot titles start with a capital; they are retitled at merge.
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --features stats
