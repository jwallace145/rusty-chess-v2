name: Release

# Merges to main accumulate changes in a Release Please PR. Merging that PR is
# the deliberate, human-reviewed act that tags a version, writes CHANGELOG.md,
# bumps every crate's version in the workspace, and publishes binaries.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that release PRs are authored
      # by jwallace145-release-bot[bot] and CI runs on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Release binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach binaries to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cpu: apple-m1
          - os: macos-latest
            target: x86_64-apple-darwin
            cpu: x86-64-v3
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # A portable CPU baseline instead of the `target-cpu=native` that
      # .cargo/config.toml uses for local builds, so installed binaries run
      # on every machine of that architecture.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (the binary prints its version)
        if: matrix.target != 'x86_64-apple-darwin' # cross-compiled on an arm64 runner
        run: target/${{ matrix.target }}/release/rusty-chess --version
      - name: Package
        id: package
        run: |
          name="rusty-chess-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rusty-chess" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber --repo "${{ github.repository }}"

  telemetry:
    name: Release telemetry
    # Attaches the release's benchmark data to the GitHub release, where it
    # never expires: the raw bench.jsonl, stats.jsonl and perft.jsonl with
    # their logs, a summary.json, and one tarball of all of it. The data is
    # the run recorded in the release PR under benchmarks/<tag>/, the same
    # run the CHANGELOG section and docs/benchmarks.md were derived from, so
    # every published number has its raw data attached. If that directory is
    # missing, the release is measured here instead, the same way.
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets and edit the release notes
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Use the benchmarks recorded in the release PR, or measure now
        run: |
          if [ -f "benchmarks/$TAG/bench.jsonl" ]; then
            echo "Using the run recorded in the release PR: benchmarks/$TAG"
            cp -r "benchmarks/$TAG" run
          else
            echo "::warning::benchmarks/$TAG was not recorded in the release PR; measuring now"
            cargo build --release --locked
            cargo build --release --locked --features stats --target-dir target/stats
            mkdir -p run
            target/release/rusty-chess bench --out run/bench.jsonl > run/bench.log
            target/stats/release/rusty-chess bench --out run/stats.jsonl > run/stats.log
            target/release/rusty-chess perft --suite tests/perft.epd --out run/perft.jsonl > run/perft.log
            cargo run --release --locked -p rusty-chess-tools --bin bench-history -- summary --version "$TAG" --date "$(date -u +%F)" --dir run > run/summary.json
          fi
          ls -l run
      - name: Attach the benchmark data to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "rusty-chess-${TAG}-benchmarks.tar.gz" -C run .
          gh release upload "$TAG" run/* "rusty-chess-${TAG}-benchmarks.tar.gz" --clobber --repo "${{ github.repository }}"
      - name: Add the benchmarks, with deltas against the previous release, to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous release is the newest one that is not this one.
          prev=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --json tagName --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")
          args=(--version "$TAG" --dir run)
          if [ -n "$prev" ] && gh release download "$prev" --repo "${{ github.repository }}" --dir prev --pattern '*.jsonl' 2>/dev/null; then
            args+=(--prev-dir prev --prev-version "$prev")
          fi
          cargo run --release --locked -p rusty-chess-tools --bin bench-history -- notes "${args[@]}" > bench-notes.md
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > notes.md
          { echo; cat bench-notes.md; } >> notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
