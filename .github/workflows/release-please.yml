name: Release

# Merges to main accumulate changes in a Release Please PR. Merging that PR is
# the deliberate, human-reviewed act that tags a version, writes CHANGELOG.md,
# bumps every crate's version in the workspace, and publishes binaries.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that release PRs are authored
      # by jwallace145-release-bot[bot] and CI runs on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Release binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach binaries to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cpu: apple-m1
          - os: macos-latest
            target: x86_64-apple-darwin
            cpu: x86-64-v3
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # A portable CPU baseline instead of the `target-cpu=native` that
      # .cargo/config.toml uses for local builds, so installed binaries run
      # on every machine of that architecture.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (the binary prints its version)
        if: matrix.target != 'x86_64-apple-darwin' # cross-compiled on an arm64 runner
        run: target/${{ matrix.target }}/release/rusty-chess --version
      - name: Package
        id: package
        run: |
          name="rusty-chess-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rusty-chess" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber --repo "${{ github.repository }}"

  telemetry:
    name: Release telemetry
    # Benches the release on the Linux runner with the same portable CPU
    # baseline the shipped binary uses, attaches bench.jsonl, stats.jsonl
    # and perft.jsonl to the GitHub release (they never expire, unlike
    # workflow artifacts), and writes the bench signature into the release
    # notes. The PR bench comment compares against these assets.
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets and edit the release notes
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries, with and without stats
        run: |
          cargo build --release --locked
          cargo build --release --locked --features stats --target-dir target/stats
      - name: Bench, stats bench and perft suite
        id: bench
        run: |
          target/release/rusty-chess bench --out bench.jsonl | tee bench.log
          target/stats/release/rusty-chess bench --out stats.jsonl > stats.log
          # The perft suite arrives with Phase 1; until then the subcommand reports that and exits 3.
          if target/release/rusty-chess perft --suite tests/perft.epd --out perft.jsonl > perft.log 2>&1; then
            echo "perft suite recorded"
          else
            echo "perft suite not available in this release; see perft.log"
            rm -f perft.jsonl
          fi
          echo "nodes=$(sed -n 's/^Nodes searched  : //p' bench.log)" >> "$GITHUB_OUTPUT"
          echo "nps=$(sed -n 's/^Nodes\/second    : //p' bench.log)" >> "$GITHUB_OUTPUT"
          echo "perft_nps=$(sed -n 's/^Nodes\/second    : //p' perft.log)" >> "$GITHUB_OUTPUT"
          echo "perft_checks=$(sed -n 's/^Checks          : //p' perft.log)" >> "$GITHUB_OUTPUT"
      - name: Attach the telemetry to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="bench.jsonl stats.jsonl bench.log stats.log perft.log"
          [ -f perft.jsonl ] && files="$files perft.jsonl"
          gh release upload "$TAG" $files --clobber --repo "${{ github.repository }}"
      - name: Add the benchmarks, with deltas against the previous release, to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run && cp bench.jsonl stats.jsonl run/ && { cp perft.jsonl run/ 2>/dev/null || true; }
          # The previous release is the newest one that is not this one.
          prev=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --json tagName --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")
          args=(--version "$TAG" --dir run)
          if [ -n "$prev" ] && gh release download "$prev" --repo "${{ github.repository }}" --dir prev --pattern '*.jsonl' 2>/dev/null; then
            args+=(--prev-dir prev --prev-version "$prev")
          fi
          cargo run --release --locked -p rusty-chess-tools --bin bench-history -- notes "${args[@]}" > bench-notes.md
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > notes.md
          { echo; cat bench-notes.md; } >> notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
