name: Release benchmarks

# Records a release's benchmarks into its Release Please PR before it is
# cut. One run per version, and everything comes from it: the raw files
# under benchmarks/v<version>/ (bench.jsonl, stats.jsonl, perft.jsonl, their
# logs and summary.json), a row in docs/benchmarks.md, and a `### Benchmarks`
# section under the version's heading in CHANGELOG.md with deltas against the
# previous release. The release job attaches that same directory to the
# GitHub release. Measured from the build that will ship, on the same runner class
# and CPU baseline as the release binaries. The commit is pushed with the
# release bot's token so CI runs on it, and the PR is reviewed and merged
# by a human as before. Release Please rewrites its branch whenever main
# moves; this job then records again. A version that already has a row is
# left alone, so the job's own push does not loop.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  record:
    name: Record release benchmarks
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release bot's token, so the push triggers CI on the new head
      # (pushes made with GITHUB_TOKEN do not).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Read the version and check whether it is already recorded
        id: version
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Two independent guards against re-recording, so this job's own
          # push can never start another round: the recorded data exists, or
          # the head commit is this job's own commit.
          if [ -f "benchmarks/v$version/summary.json" ] || [ -f "benchmarks/v$version/bench.jsonl" ]; then
            echo "v$version is already recorded; nothing to do."
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          elif git log -1 --format=%s | grep -q '^docs: record v[0-9.]* benchmarks$'; then
            echo "The head commit is this job's own; nothing to do."
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.recorded != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.recorded != 'true'
      - name: Bench, stats bench and perft suite on the build that will ship
        if: steps.version.outputs.recorded != 'true'
        run: |
          cargo build --release --locked
          cargo build --release --locked --features stats --target-dir target/stats
          run="benchmarks/v${{ steps.version.outputs.version }}"
          mkdir -p "$run"
          target/release/rusty-chess bench --out "$run/bench.jsonl" > "$run/bench.log"
          target/stats/release/rusty-chess bench --out "$run/stats.jsonl" > "$run/stats.log"
          target/release/rusty-chess perft --suite tests/perft.epd --out "$run/perft.jsonl" > "$run/perft.log"
          tail -3 "$run/bench.log"; tail -3 "$run/perft.log"
      - name: Record into docs/benchmarks.md and CHANGELOG.md
        if: steps.version.outputs.recorded != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          run="benchmarks/v$VERSION"
          date=$(date -u +%F)
          args=(--version "$VERSION" --date "$date" --dir "$run")
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev --pattern '*.jsonl' 2>/dev/null; then
            args+=(--prev-dir prev --prev-version "$prev")
          fi
          cargo run --release --locked -p rusty-chess-tools --bin bench-history -- record "${args[@]}"
          cargo run --release --locked -p rusty-chess-tools --bin bench-history -- summary --version "$VERSION" --date "$date" --dir "$run" > "$run/summary.json"
          git status --short
      - name: Commit to the release PR
        if: steps.version.outputs.recorded != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # -f: the data must be committed even if an ignore rule ever matches it.
          git add -f "benchmarks/v${VERSION}" docs/benchmarks.md CHANGELOG.md
          for f in bench.jsonl stats.jsonl perft.jsonl summary.json; do
            git diff --cached --name-only | grep -qx "benchmarks/v${VERSION}/$f" || { echo "::error::benchmarks/v${VERSION}/$f is not staged"; exit 1; }
          done
          git commit -m "docs: record v${VERSION} benchmarks"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
