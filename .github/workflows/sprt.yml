name: SPRT

# Strength test of a PR against its base: two SPRTs at once, on two
# standardized runners, posted as one comment.
#
#   SPRT (timed)        fastchess games at the `[sprt] tc` time control. What
#                       the engine does at a clock. This is the gate: only an
#                       accepted H1 passes it.
#   SPRT (fixed nodes)  games at `[sprt] nodes_per_move`. Whether the search got
#                       smarter per node, whatever a node costs. Informational:
#                       it explains the timed result and never fails the PR.
#
# Why both: a fixed-node test gives a change that makes nodes dearer extra work
# for free. Between v0.13.0 and v0.18.0 the fixed-node SPRTs summed to about
# +190 Elo while a 10+0.1 match of the two releases measured +26 (#83). The
# pair says which of four things happened; see `interpret` in
# crates/tools/src/sprt.rs and the comment it writes.
#
# Where: by default each leg runs on its own dedicated 64-core c8a.16xlarge
# spot instance, launched for the job and terminated after it, through
# jwall-engineering-infra's remote-task workflow (its docs/remote-tasks.md).
# The leg's work is ci/strength-task.sh, at the PR's head commit; it plays
# 60 games at once; the timed leg (the gate) on demand, the fixed-node leg on
# spot. Setting the repository variable SPRT_RUNNER to `github`
# switches back to the GitHub-hosted runners (4 games at once), the fallback
# until the remote path has a track record. A spot interruption or a launch
# with no capacity is reported in the comment as that, with no verdict, and
# fails the check: re-run.
#
# Labels: `sprt` runs both to a verdict. `sprt-quick` runs both capped at 50
# pairs, a pipeline smoke test that never reaches a verdict. Both re-run on
# every push while the label is on. A `perf` PR (unchanged bench signature)
# needs neither: the bench comment's speed rows are its test.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: sprt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C target-cpu=x86-64-v3
  FASTCHESS_VERSION: v1.8.2-alpha
  QUICK: ${{ contains(github.event.pull_request.labels.*.name, 'sprt-quick') && !contains(github.event.pull_request.labels.*.name, 'sprt') }}

jobs:
  # The remote path: one dedicated instance per leg. Two jobs rather than a
  # matrix, so the comment job can read each leg's outcome.
  timed:
    name: SPRT (timed)
    if: (contains(github.event.pull_request.labels.*.name, 'sprt') || contains(github.event.pull_request.labels.*.name, 'sprt-quick')) && vars.SPRT_RUNNER != 'github'
    uses: jwallace145/jwall-engineering-infra/.github/workflows/remote-task.yml@v0.15.1
    with:
      project: rusty-chess
      script: ci/strength-task.sh
      args: '["--mode", "timed", "--pr", "${{ github.event.pull_request.head.sha }}", "--base", "${{ github.event.pull_request.base.sha }}", "--quick", "${{ contains(github.event.pull_request.labels.*.name, ''sprt-quick'') && !contains(github.event.pull_request.labels.*.name, ''sprt'') }}"]'
      artifact: sprt-timed
      # The gate runs on demand: a spot reclamation leaves a PR with no
      # verdict, which happened to two timed legs on 2026-10-30 (#95, #101).
      # About $3.45 an hour instead of $1.27, roughly $1-3 more per PR. The
      # fixed-node leg, informational, stays on spot.
      market: on-demand
    permissions:
      contents: read
      id-token: write # the task role, through OIDC

  nodes:
    name: SPRT (fixed nodes)
    if: (contains(github.event.pull_request.labels.*.name, 'sprt') || contains(github.event.pull_request.labels.*.name, 'sprt-quick')) && vars.SPRT_RUNNER != 'github'
    uses: jwallace145/jwall-engineering-infra/.github/workflows/remote-task.yml@v0.15.1
    with:
      project: rusty-chess
      script: ci/strength-task.sh
      args: '["--mode", "nodes", "--pr", "${{ github.event.pull_request.head.sha }}", "--base", "${{ github.event.pull_request.base.sha }}", "--quick", "${{ contains(github.event.pull_request.labels.*.name, ''sprt-quick'') && !contains(github.event.pull_request.labels.*.name, ''sprt'') }}"]'
      artifact: sprt-nodes
    permissions:
      contents: read
      id-token: write # the task role, through OIDC

  # The GitHub-hosted fallback (SPRT_RUNNER=github): both legs on 4-vCPU runners.
  play:
    name: SPRT (${{ matrix.title }}, GitHub-hosted)
    if: (contains(github.event.pull_request.labels.*.name, 'sprt') || contains(github.event.pull_request.labels.*.name, 'sprt-quick')) && vars.SPRT_RUNNER == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: timed
            title: timed
            flag: --timed
          - mode: nodes
            title: fixed nodes
            flag: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the PR engine and the tools
        run: |
          cargo build --release --locked --quiet
          cargo build --release --locked --quiet -p rusty-chess-tools --bin sprt-report
          mkdir -p engines && cp target/release/rusty-chess engines/pr
          echo "PR engine: $(engines/pr --version), bench $(engines/pr bench | awk -F: '/Nodes searched/ {gsub(/ /, "", $2); print $2}')"
      - name: Build the base engine from the PR's merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 --quiet origin "$BASE_SHA"
          git worktree add --quiet base "$BASE_SHA"
          cargo build --release --locked --quiet --manifest-path base/Cargo.toml --target-dir target/base
          cp target/base/release/rusty-chess engines/base
          echo "Base engine at ${BASE_SHA:0:7}: $(engines/base --version), bench $(engines/base bench | awk -F: '/Nodes searched/ {gsub(/ /, "", $2); print $2}')"
      - name: Fetch fastchess ${{ env.FASTCHESS_VERSION }}
        run: |
          curl -sSL -o fastchess.tar "https://github.com/Disservin/fastchess/releases/download/${FASTCHESS_VERSION}/fastchess-linux-x86-64.tar"
          mkdir -p fc && tar -xf fastchess.tar -C fc
          FC=$(find fc -type f -perm -u+x -name 'fastchess*' | head -1)
          chmod +x "$FC"
          echo "FC=$FC" >> "$GITHUB_ENV"
      - name: Play (${{ matrix.title }})
        # Only fastchess's running result is shown here, every 20 games; the
        # full log and the games are in the artifact.
        run: |
          override="${{ matrix.flag }}"
          if [ "$QUICK" = "true" ]; then override="$override --max-rounds 50"; echo "sprt-quick: capped at 50 pairs, a smoke test"; fi
          read -ra args <<< "$(target/release/sprt-report args --config perf-targets.toml $override)"
          set +e
          "$FC" -engine cmd=engines/pr name=pr -engine cmd=engines/base name=base "${args[@]}" -pgnout file=sprt.pgn > sprt.log 2>&1 &
          pid=$!
          shown=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 30
            n=$(grep -c '^Results of' sprt.log)
            if [ "$n" -gt "$shown" ]; then
              shown=$n
              awk '/^Results of/ {b=""} /^(Elo|LOS|Games|LLR):/ {b=b $0 "\n"} END {printf "%s", b}' sprt.log | sed 's/^/  /'
              echo "  ---"
            fi
          done
          wait "$pid"; code=$?
          grep -E "SPRT .* completed|Tournament finished" sprt.log | tail -2
          echo "fastchess exit $code"
          exit $code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sprt-${{ matrix.mode }}
          path: |
            sprt.log
            sprt.pgn
          if-no-files-found: warn
      - name: Verdict (${{ matrix.title }})
        # The timed job is the gate and fails unless H1 was accepted (a smoke
        # test may be inconclusive). The fixed-node job reports and passes.
        run: |
          smoke=""; if [ "$QUICK" = "true" ]; then smoke="--smoke --max-rounds 50"; fi
          target/release/sprt-report render --config perf-targets.toml ${{ matrix.flag }} $smoke --log sprt.log \
            --head "${{ github.event.pull_request.head.sha }}" --base "main" --fastchess "$FASTCHESS_VERSION" \
            --openings "$(grep -c . tests/openings/openings.epd)" > sprt.md; status=$?
          cat sprt.md >> "$GITHUB_STEP_SUMMARY"
          grep -m1 -E "H1 accepted|H0 accepted|inconclusive" sprt.md
          if [ "${{ matrix.mode }}" = "timed" ] && [ "$status" != "0" ]; then
            echo "::error::The timed SPRT did not accept H1: only an accepted H1 passes the gate. The owner may merge over this for a reason stated in the PR."
            exit 1
          fi

  comment:
    name: SPRT comment
    needs: [timed, nodes, play]
    if: ${{ !cancelled() && (needs.timed.result != 'skipped' || needs.nodes.result != 'skipped' || needs.play.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post and refresh the SPRT comment
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: sprt-*
      - name: Combine both runs into one comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TIMED_OUTCOME: ${{ needs.timed.outputs.outcome }}
          TIMED_AT: ${{ needs.timed.outputs.interrupted-at }}
          NODES_OUTCOME: ${{ needs.nodes.outputs.outcome }}
          NODES_AT: ${{ needs.nodes.outputs.interrupted-at }}
        run: |
          cargo build --release --locked --quiet -p rusty-chess-tools --bin sprt-report
          smoke=""; if [ "$QUICK" = "true" ]; then smoke="--smoke --max-rounds 50"; fi
          # A leg the infrastructure stopped gets a note instead of a result;
          # its partial log (the -interrupted artifact) is never read for one.
          note() {
            case "$1" in
              interrupted) echo "⚠️ **Interrupted by spot reclamation** at ${2:-an unknown time}. There is no verdict; re-run the SPRT (push again, or *Re-run failed jobs*)." ;;
              no-capacity) echo "⚠️ **No capacity** to launch the test instance, spot or on demand. There is no verdict; re-run the SPRT later." ;;
            esac
          }
          timed_note=$(note "$TIMED_OUTCOME" "$TIMED_AT")
          nodes_note=$(note "$NODES_OUTCOME" "$NODES_AT")
          if [ -n "$timed_note" ]; then
            echo "::error::The timed SPRT was stopped by the infrastructure ($TIMED_OUTCOME), not the engine: re-run it."
          fi
          target/release/sprt-report combine --config perf-targets.toml $smoke \
            --timed-note "$timed_note" --nodes-note "$nodes_note" \
            --timed-log sprt-timed/sprt.log --nodes-log sprt-nodes/sprt.log \
            --head "${HEAD_SHA:0:7}" --base "main@${BASE_SHA:0:7}" --fastchess "$FASTCHESS_VERSION" \
            --openings "$(grep -c . tests/openings/openings.epd)" > sprt.md || true
          cat sprt.md
          cat sprt.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the SPRT comment (refreshed on every run)
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: sprt
          path: sprt.md
