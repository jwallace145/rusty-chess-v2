name: Match

# A head-to-head match between any two builds of the engine: candidate vs
# baseline, each a tag, branch or SHA, at a time control or fixed nodes per
# move, from our openings. A diagnostic, not a merge gate: it answers "how far
# apart are these two" with an interval at a chosen confidence (99% by
# default), computed from the pentanomial counts, and says how many games a
# conclusive answer would take when this one is not.
#
# Where: by default on a dedicated 64-core c8a.16xlarge spot instance,
# launched for the run and terminated after it, through jwall-engineering-infra's
# remote-task workflow (its docs/remote-tasks.md), playing 60 games at once.
# The work is ci/match-task.sh. `runner: github` plays on a GitHub-hosted
# runner instead, `concurrency` games at once. Run it from `main`: the task
# role trusts only main and pull requests.
#
# Choose the number of games before the run and let it finish: stopping a
# fixed-length match early because it looks significant inflates the false
# positives. The report says how many games would settle an inconclusive one.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate engine (tag, branch or SHA)
        required: true
        default: main
      baseline:
        description: Baseline engine (tag, branch or SHA)
        required: true
      tc:
        description: Time control, seconds+increment (ignored when nodes is set)
        required: false
        default: "10+0.1"
      nodes:
        description: Fixed nodes per move instead of a clock (blank for the time control)
        required: false
        default: ""
      games:
        description: Games in total (even; each opening is played from both sides)
        required: false
        default: "2000"
      confidence:
        description: Two-sided confidence of the reported interval
        type: choice
        options: ["99", "95", "99.9"]
        default: "99"
      hash:
        description: Hash per engine, MB
        required: false
        default: "64"
      note:
        description: Why this match is being run (shown at the top of the report)
        required: false
        default: ""
      runner:
        description: Where to play
        type: choice
        options: [remote, github]
        default: remote
      concurrency:
        description: Games at once on the GitHub-hosted runner (runner = github only; 4 vCPUs)
        required: false
        default: "4"

run-name: "Match: ${{ inputs.candidate }} vs ${{ inputs.baseline }} at ${{ inputs.nodes != '' && format('{0} nodes', inputs.nodes) || inputs.tc }}, ${{ inputs.games }} games"

concurrency:
  group: match-${{ inputs.candidate }}-${{ inputs.baseline }}-${{ inputs.tc }}-${{ inputs.nodes }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve refs and check settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      args: ${{ steps.args.outputs.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve both refs to commits
        id: args
        env:
          CANDIDATE: ${{ inputs.candidate }}
          BASELINE: ${{ inputs.baseline }}
          TC: ${{ inputs.tc }}
          NODES: ${{ inputs.nodes }}
          GAMES: ${{ inputs.games }}
          CONFIDENCE: ${{ inputs.confidence }}
          HASH_MB: ${{ inputs.hash }}
          NOTE: ${{ inputs.note }}
          RUNNER: ${{ inputs.runner }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          resolve() { git rev-parse --verify --quiet "$1^{commit}" || git rev-parse --verify "origin/$1^{commit}"; }
          cand=$(resolve "$CANDIDATE") base=$(resolve "$BASELINE")
          echo "Candidate: $CANDIDATE at ${cand:0:7}"
          echo "Baseline:  $BASELINE at ${base:0:7}"
          # Validate the settings here, before an instance is launched.
          [ "$RUNNER" = github ] && conc="$CONCURRENCY" || conc=60
          cargo build --release --locked -q -p rusty-chess-tools --bin match-report
          target/release/match-report args --tc "$TC" --nodes "$NODES" --games "$GAMES" --concurrency "$conc" \
            --hash "$HASH_MB" --openings tests/openings/openings.epd --confidence "$CONFIDENCE" > /dev/null
          [ "$RUNNER" = github ] && extra=(--concurrency "$CONCURRENCY") || extra=()
          # One argument per line into a JSON array of single-line strings,
          # as remote-task.yml wants; the note loses any newlines.
          argv=(--candidate "$cand" --baseline "$base" --candidate-label "$CANDIDATE" --baseline-label "$BASELINE"
            --tc "$TC" --nodes "$NODES" --games "$GAMES" --hash "$HASH_MB" --confidence "$CONFIDENCE"
            --note "$(tr '\n' ' ' <<< "$NOTE" | sed 's/ *$//')" "${extra[@]}")
          args=$(printf '%s\n' "${argv[@]}" | jq -R . | jq -cs .)
          echo "Task arguments: $args"
          echo "args=$args" >> "$GITHUB_OUTPUT"

  remote:
    name: Play on a dedicated instance
    needs: resolve
    if: inputs.runner == 'remote'
    uses: jwallace145/jwall-engineering-infra/.github/workflows/remote-task.yml@v0.14.0
    with:
      project: rusty-chess
      script: ci/match-task.sh
      args: ${{ needs.resolve.outputs.args }}
      artifact: match
    permissions:
      contents: read
      id-token: write # the task role, through OIDC

  github:
    name: Play on a GitHub-hosted runner
    needs: resolve
    if: inputs.runner == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Play
        env:
          ARGS: ${{ needs.resolve.outputs.args }}
        run: |
          mapfile -t argv < <(jq -r '.[]' <<< "$ARGS")
          mkdir -p out
          OUT_DIR=out ci/match-task.sh "${argv[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: match
          path: out
          if-no-files-found: warn

  report:
    name: Report
    needs: [remote, github]
    if: ${{ !cancelled() && (needs.remote.result != 'skipped' || needs.github.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A missing artifact (an interrupted or failed run) is handled below.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: match
          path: match
      - name: Write the report to the run summary
        env:
          OUTCOME: ${{ needs.remote.outputs.outcome }}
          AT: ${{ needs.remote.outputs.interrupted-at }}
        run: |
          case "$OUTCOME" in
            interrupted) echo "⚠️ **Interrupted by spot reclamation** at ${AT:-an unknown time}. There is no result; re-run the match. The partial log is in the \`match-interrupted\` artifact." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            no-capacity) echo "⚠️ **No capacity** to launch the instance. There is no result; re-run later, or with \`runner: github\`." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          if [ ! -f match/match.md ]; then
            echo "The match produced no report; see the play job's log." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat match/match.md >> "$GITHUB_STEP_SUMMARY"
          cat match/match.md
