[workspace]
resolver = "3"
# Members are listed explicitly (no globs): Release Please's `rust` strategy
# reads this list to bump every crate's version together.
members = [
  "crates/core",
  "crates/search",
  "crates/uci",
  "crates/tools",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jimmy Wallace <jimmy.wallace145@gmail.com>"]
repository = "https://github.com/jwallace145/rusty-chess-v2"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Local builds add `-C target-cpu=native` through `.cargo/config.toml`;
# release CI builds for a portable baseline instead.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1 # line tables only, so flamegraphs resolve symbols

[profile.bench]
inherits = "release"
