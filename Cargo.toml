# The workspace root is also a package: the `braveheart` engine binary (UCI
# front end, `bench` and `perft` subcommands). Release Please's `rust`
# strategy bumps the root package and every member together, and the root
# `tests/` and `benches/` directories belong to this package.
[package]
name = "braveheart"
version = "0.53.0"
description = "A UCI chess engine in Rust: classical search measured to be strong before NNUE"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "braveheart"
path = "src/main.rs"

[features]
# Search statistics counters; forwarded to the search crate.
stats = ["braveheart-search/stats"]

[dependencies]
braveheart-core = { path = "crates/core" }
braveheart-search = { path = "crates/search" }
braveheart-tools = { path = "crates/tools" }

[lints]
workspace = true

[workspace]
resolver = "3"
# Members are listed explicitly (no globs): Release Please's `rust` strategy
# reads this list to bump every crate's version together with the root.
members = [
  "crates/core",
  "crates/search",
  "crates/tools",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jimmy Wallace <jimmy.wallace145@gmail.com>"]
repository = "https://github.com/jwallace145/braveheart"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Local builds add `-C target-cpu=native` through `.cargo/config.toml`;
# release CI builds for a portable baseline instead.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1 # line tables only, so flamegraphs resolve symbols

[profile.bench]
inherits = "release"
