# Local git hooks. Install once with `pre-commit install --hook-type commit-msg --hook-type pre-commit`.
# CI is the authoritative check; these hooks exist so that mistakes are caught
# before they are pushed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: commitlint
        name: commitlint (one-line Conventional Commit)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
