# Self-play training data for NNUE: the settings `datagen` plays with. One
# file for every generation of nets, versioned with the engine that uses it;
# a run records these values in every shard's manifest, so a dataset always
# says how it was made. See docs/datagen.md for the layout and the formats.

[datagen]
# Which net generation plays: 0 is the hand-written PeSTO evaluation, n the
# engine carrying net n. Raise it when a new net ships.
generation = 4
# Nodes per move. The search's score at this budget is the training label
# (with the game's result); about depth 8-10 for this engine. More nodes give
# better labels and fewer positions per hour.
nodes = 5000
# Random plies from the start position before the search plays: this many or
# two more, at random. Must be even, so both colours make as many random
# moves; the odd counts used for generation 0's first run gave white an extra
# one and black a 1.4-point edge.
random_plies = 8
# Replay an opening the search scores beyond this many centipawns. 400 let 13%
# of generation 0's games start beyond ±200.
max_opening_cp = 250
# Transposition table per worker, MB (one worker per core).
hash_mb = 16
# Positions per shard. A shard is written whole when it fills, so a spot
# interruption loses at most the shard each worker has in progress: about a
# minute of play at these settings.
shard_positions = 25000
# Win adjudication: this many consecutive plies at or beyond win_cp for the
# same side. Measured on generation 0 (docs/datagen-runbook.md): at 2000 every
# adjudicated position was a forced mate a few moves away; 1200 would have
# called the right winner in 99.98% of games (0.02% drawn, none reversed) and
# saves 3.4% of the searches spent on decided games.
win_plies = 4
win_cp = 1200
# Draw adjudication: from this game ply on, this many consecutive plies
# within draw_cp of zero.
draw_after_ply = 80
draw_plies = 12
draw_cp = 10
# A game that reaches this many plies is a draw.
max_plies = 400

# Quality bars for `datagen-audit check` (docs/datagen-runbook.md). A
# statistic outside its bar is a warning to investigate, not a failure;
# correctness (P0) checks have no bars, they must find zero problems. Set from
# generation 0's audit; review them when the settings above change.
[audit]
# Share of games drawn (generation 0: 34.6%).
draw_rate = [0.20, 0.55]
# |white wins - black wins| / games. It catches a colour bias the generator
# introduces, such as odd random plies giving white an extra move. White's
# first-move advantage is real and shows more as the player gets stronger:
# generation 0 (PeSTO) 1.4 points; generation 1's smoke test (net 1, even
# random plies, 6,088 games) 7.9 ± 0.9, white scoring 54%, typical of strong
# engines from balanced openings. Widened from 0.03 for generation 1.
color_gap_max = 0.10
# Share of records whose position (placement, side, castling, en passant) repeats another's (2.2%).
duplicate_rate_max = 0.05
# Distinct start positions / games (100%).
distinct_openings_min = 0.99
# Share of records with |score| <= 100 cp (39.0%).
near_zero_share = [0.25, 0.60]
# Share of records with |score| > 700 cp (10.9%).
decisive_share_max = 0.20
# Share of records with at most 20 points of non-pawn material on the board (45.8%).
endgame_share_max = 0.50
# Records kept / searched plies (73.2%).
kept_share = [0.60, 0.85]
# Median game length in engine plies after the opening (125).
median_game_plies = [60.0, 250.0]
# With `--research N`: fresh re-search against the labels (0.989, 99.7%, depth 7).
research_correlation_min = 0.95
research_same_sign_min = 0.98
research_median_depth_min = 6.0
