[package]
name = "rusty-chess-tools"
version = "0.34.0"
description = "Developer tools: perft suite runner, performance gate, bench and stats diffing, data generation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "rusty_chess_tools"

[[bin]]
name = "perf-gate"
path = "src/bin/perf_gate.rs"

[[bin]]
name = "bench-history"
path = "src/bin/bench_history.rs"

[[bin]]
name = "bench-report"
path = "src/bin/bench_report.rs"

[[bin]]
name = "openings"
path = "src/bin/openings.rs"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[[bin]]
name = "datagen-audit"
path = "src/bin/datagen_audit.rs"

[[bin]]
name = "nnue-eval"
path = "src/bin/nnue_eval.rs"

[[bin]]
name = "speed-report"
path = "src/bin/speed_report.rs"

[[bin]]
name = "rating-report"
path = "src/bin/rating_report.rs"

[[bin]]
name = "match-report"
path = "src/bin/match_report.rs"

[[bin]]
name = "sprt-report"
path = "src/bin/sprt_report.rs"

[dependencies]
rusty-chess-core = { path = "../core" }
rusty-chess-search = { path = "../search" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
flate2 = "1"
# The text parser and binary writer bullet's `convert --from text` uses; the
# audit runs every sampled record through it.
bulletformat = "=1.8.0"
toml = "1.1"

[lints]
workspace = true
