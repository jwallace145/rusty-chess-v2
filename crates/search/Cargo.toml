[package]
name = "braveheart-search"
version = "0.52.0"
description = "Search, transposition table, move picker, evaluation and search telemetry"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "braveheart_search"

[features]
# Search statistics counters. Off by default: every `stat!` compiles to nothing.
stats = []

[dependencies]
braveheart-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
