[package]
name = "rusty-chess-uci"
version = "0.1.0"
description = "UCI protocol front end and the `rusty-chess` binary (bench and perft subcommands)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rusty-chess"
path = "src/main.rs"

[dependencies]
rusty-chess-core = { path = "../core" }
rusty-chess-search = { path = "../search" }

[features]
stats = ["rusty-chess-search/stats"]

[lints]
workspace = true
