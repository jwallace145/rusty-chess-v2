# Performance bars. `perf-gate` compares each run's telemetry to these.
#
# Every bar only goes up: CI fails a PR that lowers one. Speed bars are per
# environment because shared CI runners are slower and noisier than a quiet
# local machine; they are reported on every PR and enforced on release PRs
# and local runs. Efficiency bars are deterministic and always enforced.
# A bar of 0 is not enforced yet; set it when the layer first ships, then
# raise it as the engine improves.

[movegen]
# Bulk-counting perft over tests/perft.epd. Roadmap Phase 1 gate: 100M NPS locally
# (an M-series laptop does 250M+, a shared ubuntu runner about 380M).
min_perft_nps = { local = 100_000_000, ci = 100_000_000 }

[search]
# `rusty-chess bench` at its default depth. Roadmap Phase 2 target: 2M NPS with
# PeSTO eval. The Phase 2 baseline does about 8M on an M-series laptop; the bar
# starts at the roadmap figure because Phase 3's transposition table and move
# picker add per-node work before they pay it back in depth.
min_nps = { local = 2_000_000, ci = 1_000_000 }

[efficiency]
# From `bench` built with `--features stats`. Roadmap Phase 3 gate: >= 0.90 and <= 3.0.
min_fail_high_first = 0.0
max_ebf = 0.0

[comment]
# The PR bench comment shows a delta smaller than these as unchanged (⚪)
# rather than as an improvement (🟢) or a regression (🔴).
speed_noise_pct = 10.0      # NPS rows; shared runners vary this much run to run
efficiency_noise_pct = 1.0  # percentage points of fail-high-first, percent of EBF

[sprt]
# Strength tests on CI (the `sprt` label). Both engines play at a fixed node
# budget per move, so the verdict does not depend on the runner; NPS is judged
# by the bench gate. elo1 is the gain a change must plausibly deliver; tighten
# it as gains get smaller.
nodes_per_move = 200_000
elo0 = 0.0
elo1 = 10.0
alpha = 0.05
beta = 0.05
max_rounds = 1500   # pairs of games before giving up without a verdict
concurrency = 3     # ubuntu-latest has 4 vCPUs; one is left for fastchess
openings = "tests/openings/openings.epd"
