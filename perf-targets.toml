# Performance bars. `perf-gate` compares each run's telemetry to these.
#
# Every bar only goes up: CI fails a PR that lowers one. Speed bars are per
# environment because shared CI runners are slower and noisier than a quiet
# local machine; they are reported on every PR and enforced on release PRs
# and local runs. Efficiency bars are deterministic and always enforced.
# A bar of 0 is not enforced yet; set it when the layer first ships, then
# raise it as the engine improves.

[movegen]
# Bulk-counting perft over tests/perft.epd. Roadmap Phase 1 gate: 100M NPS locally
# (an M-series laptop does 250M+, a shared ubuntu runner about 380M).
min_perft_nps = { local = 100_000_000, ci = 100_000_000 }

[search]
# `rusty-chess bench` at its default depth. Roadmap Phase 2 target: 2M NPS with
# PeSTO eval. The Phase 2 baseline does about 8M on an M-series laptop; the bar
# starts at the roadmap figure because Phase 3's transposition table and move
# picker add per-node work before they pay it back in depth.
min_nps = { local = 2_000_000, ci = 1_000_000 }

[efficiency]
# From `bench` built with `--features stats`; deterministic, so enforced on every PR.
# Set at the end of Phase 3 (fail-high-first 0.975, EBF 4.18) with a small margin.
# Late move reductions (Phase 4) shifted fail-high-first to 0.93: reduced searches
# change which move index produces a cutoff, so the bar was lowered once with a
# declared exception below. Reverse futility pruning returns before any move is
# searched at exactly the nodes that most reliably cut off on the first move, so
# the remaining fail-highs are the harder ones: 0.90 at every margin tried, and
# lowered once more to 0.88. EBF only falls from here; Phase 4 tightens it toward 2.
min_fail_high_first = 0.88
max_ebf = 2.5

[comment]
# The PR bench comment shows a delta smaller than these as unchanged (⚪)
# rather than as an improvement (🟢) or a regression (🔴).
speed_noise_pct = 10.0      # (unused for markers now: absolute NPS rows are informational)
efficiency_noise_pct = 1.0  # percentage points of fail-high-first, percent of EBF
paired_noise_pct = 1.0      # paired speed vs base: the whole 95% interval must clear this
instructions_noise_pct = 0.5 # instructions per node is deterministic, so a small threshold

[rating]
# The strength estimate run on every release (and by hand): the engine against
# Stockfish limited to each UCI_Elo level, at a real time control, from our
# openings. Each level gives "level + measured Elo difference"; levels combine
# by inverse variance. Limited Stockfish is a ballpark scale, not CCRL.
# The rungs must bracket the engine: a level it beats in nearly every game
# says little (no finite error bar at 100%). Ladder history, so that ratings
# are compared on the same rungs: 1500/1800/2100/2400 for v0.3.0 to v0.13.0
# (v0.12.0 scored 98% on 1500 and 65% on 2400); 2200/2500/2800/3100 from
# 2026-10-28, with v0.12.0 and v0.13.0 re-rated on it for the overlap.
levels = [2200, 2500, 2800, 3100]
games_per_level = 100   # 50 openings from both sides; about 10 minutes per level
tc = "10+0.1"
concurrency = 4
hash_mb = 64
openings = "tests/openings/openings.epd"

[sprt]
# Strength tests on CI (the `sprt` label). Both engines play at a fixed node
# budget per move, so the verdict does not depend on the runner; NPS is judged
# by the bench gate. elo1 is the gain a change must plausibly deliver; tighten
# it as gains get smaller.
nodes_per_move = 200_000
# The `sprt-tc` label plays timed games at this control instead, for changes
# that fixed nodes cannot see (time management). The runner's speed is then
# part of the result, which is why it is not the default. Short enough that
# the 1000-round cap stays near an hour at concurrency 4.
tc = "5+0.05"
elo0 = 0.0
elo1 = 10.0
alpha = 0.05
beta = 0.05
max_rounds = 1000   # pairs of games before giving up without a verdict (~35 min on ubuntu-latest)
concurrency = 4     # ubuntu-latest has 4 vCPUs; fastchess itself needs almost nothing
openings = "tests/openings/openings.epd"

[ratchet]
# Bars may only be lowered when named here with a reason; this list is the
# record of every deliberate loosening. Remove an entry once the bar is back
# above its old value, so the ratchet protects it again.
exceptions = [
  "efficiency.min_fail_high_first: late move reductions (2026-10-27) change which move index cuts off; lowered 0.95 -> 0.92 while EBF tightened 4.5 -> 3.0",
  "efficiency.min_fail_high_first: reverse futility pruning (2026-10-27) removes the nodes that cut off on the first move before any move is searched; lowered 0.92 -> 0.88 while EBF tightened 3.0 -> 2.5",
]
